name: Docker Build and Push

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # The release environment admits only main, so tag-triggered jobs cannot
  # access its Docker Hub secrets. Dispatch releases from main instead.
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Existing release tag on this main commit, e.g. v2.3.0"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: docker-${{ github.event_name == 'workflow_dispatch' && 'release' || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  nightly:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: release
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          push: true
          tags: stratifai/odelia-viewer:latest
          cache-from: type=gha,scope=odelia-viewer
          cache-to: type=gha,mode=max,scope=odelia-viewer

  release:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: release
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Validate product release tag
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          node <<'NODE'
          const { productVersion } = require('./platform/app/package.json');
          if (!/^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)$/.test(productVersion) ||
              process.env.RELEASE_TAG !== 'v' + productVersion) {
            throw new Error('Release tag must match the stable productVersion');
          }
          NODE
          git fetch --no-tags origin "refs/tags/${RELEASE_TAG}:refs/tags/${RELEASE_TAG}"
          if [ "$(git rev-parse "refs/tags/${RELEASE_TAG}^{commit}")" != "$GITHUB_SHA" ]; then
            echo "::error::Release tag must point to the main commit selected for this run"
            exit 1
          fi
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: stratifai/odelia-viewer
          flavor: latest=false
          tags: |
            type=semver,pattern={{version}},value=${{ inputs.release_tag }}
            type=semver,pattern={{major}}.{{minor}},value=${{ inputs.release_tag }}
            type=semver,pattern={{major}},value=${{ inputs.release_tag }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            ODELIA_RELEASE_TAG=${{ inputs.release_tag }}
          cache-from: type=gha,scope=odelia-viewer
          cache-to: type=gha,mode=max,scope=odelia-viewer

  pr-smoke:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          push: false
          load: false
          cache-from: type=gha,scope=odelia-viewer
          cache-to: type=gha,mode=min,scope=odelia-viewer
