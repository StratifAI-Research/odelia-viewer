name: Build and release

# Every run builds the viewer image to catch breakage, but only a release
# uploads anything: sites run releases, so other builds have no use on Docker
# Hub. A push to main that changes productVersion in platform/app/package.json
# is a release: it uploads the image as sha-<commit>, tags it X.Y.Z and latest,
# and gives the commit the vX.Y.Z git tag and a GitHub Release, which is what
# installed viewers check for updates. There is no release button -- merging
# the version bump is the release, so the PR approval is the gate.
#
# The odelia-viewer-platform repository runs the same workflow for its images.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Recovery only. If a release run failed in a way a re-run cannot fix, fix the
  # cause on main and run this: it builds and releases the current main commit
  # under productVersion, provided that version has not been released yet.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # One group per main commit, so a later push can never cancel or replace the
  # run that releases an earlier one. Pull requests cancel their stale runs.
  group: build-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Reads productVersion and decides whether this run releases. On pull
  # requests it fails early when a bumped version is already taken or older
  # than a release, so a bad bump is caught in review instead of after merge.
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.check.outputs.version }}
      release: ${{ steps.check.outputs.release }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          # The parent commit is enough to tell whether the version changed. On
          # a pull request HEAD is the merge commit, whose first parent is main.
          fetch-depth: 2

      - id: check
        env:
          EVENT: ${{ github.event_name }}
        run: |
          set -euo pipefail
          fail() { echo "::error::$*"; exit 1; }
          read_version() { git show "$1:platform/app/package.json" 2>/dev/null | jq -r '.productVersion // empty' || true; }
          v=$(read_version HEAD)
          prev=$(read_version HEAD^1)
          echo "version=$v" >> "$GITHUB_OUTPUT"
          [[ "$v" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || fail "productVersion must be three numbers like 2.3.1 (got '$v')"

          # A new version must be unused and newer than every release so far,
          # which also keeps `latest` from ever moving backwards.
          newest=$(git ls-remote --tags --refs origin 'v*' | sed 's#.*refs/tags/v##' \
            | grep -E '^[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -n1 || true)
          tag_sha=$(git ls-remote origin "refs/tags/v$v" "refs/tags/v$v^{}" | tail -n1 | cut -f1)
          check_new() {
            [ -z "$tag_sha" ] || fail "v$v is already released; bump productVersion"
            if [ -n "$newest" ] && [ "$(printf '%s\n%s\n' "$newest" "$v" | sort -V | tail -n1)" != "$v" ]; then
              fail "productVersion $v must be newer than the latest release $newest"
            fi
          }
          release=false
          case "$EVENT" in
            pull_request)
              [ "$v" = "$prev" ] || check_new ;;
            push)
              if [ "$v" != "$prev" ]; then
                # A re-run of a release that already tagged this commit may finish.
                [ "$tag_sha" = "$GITHUB_SHA" ] || check_new
                release=true
              fi ;;
            workflow_dispatch)
              if [ -z "$tag_sha" ]; then
                check_new
                release=true
              elif [ "$tag_sha" = "$GITHUB_SHA" ]; then
                release=true
              else
                echo "v$v is already released on $tag_sha; nothing to do."
              fi ;;
          esac
          echo "release=$release" >> "$GITHUB_OUTPUT"
          echo "Version $v, release: $release"

  build:
    # The recovery button builds only when there is something left to release.
    needs: version
    if: github.event_name != 'workflow_dispatch' || needs.version.outputs.release == 'true'
    runs-on: ubuntu-latest
    # Docker Hub credentials are environment secrets on `release`, which only
    # main may use. Only a release run asks for them; every other run builds
    # without credentials (an empty name means "no environment").
    environment: ${{ needs.version.outputs.release == 'true' && 'release' || '' }}
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub (releases only)
        if: needs.version.outputs.release == 'true'
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}

      # A release commit is built and uploaded once. If an earlier attempt of
      # this release already uploaded the image, keep it: a rebuild would differ
      # from what a version tag may already point at, and publish would refuse.
      - name: Check for an earlier upload of this commit
        id: uploaded
        if: needs.version.outputs.release == 'true'
        env:
          REF: stratifai/odelia-viewer:sha-${{ github.sha }}
        run: |
          if docker buildx imagetools inspect "$REF" >/dev/null 2>&1; then
            echo "$REF is already uploaded; not rebuilding it."
            echo "exists=true" >> "$GITHUB_OUTPUT"
          fi

      # A release uploads only the per-commit tag here; `publish` then gives
      # this exact image its version tag. The image embeds productVersion, so
      # the build of the bump commit already carries the release's version.
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: stratifai/odelia-viewer
          tags: |
            type=sha,format=long

      - name: Build (and push sha-<commit> for a release)
        if: steps.uploaded.outputs.exists != 'true'
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          push: ${{ needs.version.outputs.release == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=odelia-viewer
          cache-to: type=gha,mode=${{ github.event_name == 'pull_request' && 'min' || 'max' }},scope=odelia-viewer

  # Gives this commit's image its version tag and moves `latest` to it.
  # Nothing is rebuilt: a release ships exactly the image this run built.
  publish:
    needs: [version, build]
    if: needs.version.outputs.release == 'true'
    runs-on: ubuntu-latest
    environment: release
    # Releases never interleave, and a queued one is never cancelled.
    concurrency:
      group: release
      cancel-in-progress: false
    steps:
      - uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}

      - name: Tag this commit's image as the release and latest
        env:
          SHA: ${{ github.sha }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          fail() { echo "::error::$*"; exit 1; }
          # The `release` environment already admits only main. This costs
          # nothing and catches that policy being widened by mistake.
          [ "$GITHUB_REF" = "refs/heads/main" ] || fail "refusing to publish from $GITHUB_REF"
          src="stratifai/odelia-viewer:sha-${SHA}"
          dst="stratifai/odelia-viewer:${VERSION}"
          d=$(docker buildx imagetools inspect --format '{{.Manifest.Digest}}' "$src" 2>&1) \
            || fail "cannot resolve ${src} (did the build job upload it?): $d"
          # A published version never moves. Re-running the same release is
          # fine; pointing it at different content is refused.
          if out=$(docker buildx imagetools inspect --format '{{.Manifest.Digest}}' "$dst" 2>&1); then
            [ "$out" = "$d" ] || fail "${dst} already exists with different content; release a new version"
          else
            # Only a genuine absence is safe to proceed from. An auth failure,
            # rate limit or network error must not be read as "tag is free".
            case "$out" in
              *"not found"*|*MANIFEST_UNKNOWN*|*"manifest unknown"*) ;;
              *) fail "cannot determine whether ${dst} exists: ${out}" ;;
            esac
          fi
          echo "${src} -> ${VERSION}, latest"
          docker buildx imagetools create -t "$dst" -t "stratifai/odelia-viewer:latest" "$src"

  # Tags the commit and publishes the GitHub Release. Installed viewers notify
  # users about it, which is why it runs only once the image exists. A separate
  # job because it is the only one with contents: write.
  record:
    needs: [version, publish]
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7.0.1

      - name: Create the git tag and GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.sha }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          tag="v${VERSION}"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release $tag already exists; nothing to do."
            exit 0
          fi
          # --target creates the tag on the commit whose image was published.
          # Hand-written notes win; otherwise GitHub lists the PRs merged since
          # the previous release, grouped as configured in .github/release.yml.
          notes=".github/release-notes/${tag}.md"
          if [ -f "$notes" ]; then
            gh release create "$tag" --target "$SHA" --title "$tag" --notes-file "$notes"
          else
            gh release create "$tag" --target "$SHA" --title "$tag" --generate-notes
          fi
