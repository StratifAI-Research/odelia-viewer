name: Setup Node + pnpm (pinned)
description: >
  Installs the Node version from .node-version and activates the pnpm version
  pinned in the root package.json's `packageManager` field via corepack. Single
  source of truth so workflows cannot drift from the lockfile's package manager.
runs:
  using: composite
  steps:
    - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version-file: .node-version
    # `manage-package-manager-versions=false` in .npmrc keeps pnpm from managing
    # its own version, so corepack is what pins it — to whatever
    # package.json#packageManager says.
    - name: Activate pnpm via corepack
      shell: bash
      run: |
        corepack enable pnpm
        corepack prepare --activate
        pnpm --version
