[run]
source =
    custom/deploy/orthanc-routing-example
    custom/deploy/orthanc-routing-example/MLIntegration
    custom/deploy/orthanc-routing-example/MLIntegration/breast-cancer-classification
    custom/deploy/orthanc-routing-example/MLIntegration/chat-middleware
    custom/deploy/orthanc-routing-example/MLIntegration/medgemma-mri
    custom/deploy/orthanc-routing-example/MLIntegration/MST-classification
    custom/deploy/orthanc-routing-example/MLIntegration/shared
    custom/deploy/orthanc-routing-example/orthanc-router
    custom/deploy/orthanc-routing-example/orthanc-viewer
branch = false
omit =
    */tests/*
    */MLIntegration/tests/*
    */sample_data/*
    */screenshots/*
    */.venv/*
    */__pycache__/*
    */.pytest_cache/*

[report]
show_missing = false
skip_covered = false
