[run]
source =
    custom/deploy/orthanc
    custom/deploy/orthanc/MLIntegration
    custom/deploy/orthanc/MLIntegration/breast-cancer-classification
    custom/deploy/orthanc/MLIntegration/chat-middleware
    custom/deploy/orthanc/MLIntegration/medgemma-mri
    custom/deploy/orthanc/MLIntegration/MST-classification
    custom/deploy/orthanc/MLIntegration/shared
    custom/deploy/orthanc/router
    custom/deploy/orthanc/viewer
branch = false
omit =
    */tests/*
    */MLIntegration/tests/*
    */sample_data/*
    */screenshots/*
    */.venv/*
    */__pycache__/*
    */.pytest_cache/*

[report]
show_missing = false
skip_covered = false
