version: 2
enable-beta-ecosystems: true

updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: daily
    open-pull-requests-limit: 10
    groups:
      npm-security-and-minor:
        applies-to: version-updates
        update-types:
          - minor
          - patch

  - package-ecosystem: npm
    directory: /custom/extension/labeling
    schedule:
      interval: weekly

  - package-ecosystem: npm
    directory: /custom/mode/labeling-mode
    schedule:
      interval: weekly

  # /platform/docs deps are pinned to match upstream OHIF (platform/docs/package.json).
  # open-pull-requests-limit: 0 disables version-update PRs while leaving security
  # advisory PRs enabled — those still open regardless of the limit.
  - package-ecosystem: npm
    directory: /platform/docs
    schedule:
      interval: monthly
    open-pull-requests-limit: 0

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
