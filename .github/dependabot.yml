version: 2
enable-beta-ecosystems: true

updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: daily
    open-pull-requests-limit: 10
    groups:
      npm-security-and-minor:
        applies-to: version-updates
        update-types:
          - minor
          - patch

  - package-ecosystem: npm
    directory: /custom/extension/labeling
    schedule:
      interval: weekly

  - package-ecosystem: npm
    directory: /custom/mode/labeling-mode
    schedule:
      interval: weekly

  - package-ecosystem: npm
    directory: /platform/docs
    schedule:
      interval: weekly

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
