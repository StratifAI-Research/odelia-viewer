# Full deployment stack for odelia-viewer, runnable end-to-end.
# Component services use published images (stratifai/odelia-*:0.1.0); the viewer
# builds from this repo (override with VIEWER_TAG / docker compose pull + --no-build).
# Default configs live in ./deploy/. For medgemma, set a valid HF_TOKEN
# (gated google/medgemma model); without it medgemma will not start.
services:
  viewer:
    image: ${DOCKER_HUB_USERNAME:-stratifai}/odelia-viewer:${VIEWER_TAG:-latest}
    container_name: odelia-viewer
    volumes:
    - ./deploy/config/nginx.conf:/etc/nginx/nginx.conf
    - ./deploy/config/app-config.js:/usr/share/nginx/html/app-config.js
    ports:
    - ${BIND_HOST:-}8081:8081
    depends_on:
    - orthanc-viewer
    - keycloak
    networks:
    - odelia-network
    environment:
    - PUBLIC_URL=/
    - PORT=8081
    user: nginx:nginx
    build:
      context: .
      dockerfile: Dockerfile
  orthanc-viewer:
    image: ${DOCKER_HUB_USERNAME:-stratifai}/odelia-orthanc-viewer:${TAG:-0.1.0}
    hostname: orthanc-viewer
    container_name: odelia-orthanc-viewer
    volumes:
    - ./deploy/orthanc/viewer/orthanc.json:/etc/orthanc/orthanc.json:ro
    - ./deploy/volumes/orthanc-viewer-db/:/var/lib/orthanc/db/
    - ./deploy/volumes/feedback-db/:/var/lib/odelia-feedback/
    restart: unless-stopped
    depends_on:
    - keycloak
    networks:
    - odelia-network
    ports:
    - ${BIND_HOST:-}8000:8042
    - ${BIND_HOST:-}2000:4242
    environment:
    - ORTHANC__NAME=orthanc-viewer
    - VERBOSE_ENABLED=true
    - VERBOSE_STARTUP=true
    - ORTHANC__PYTHON_SCRIPT=/python/router.py
    - ORTHANC__PYTHON_VERBOSE=true
    - ORTHANC_FEEDBACK_DB_DIR=/var/lib/odelia-feedback
    - ORTHANC_FEEDBACK_ENABLE_WAL=1
  orthanc-router-mst:
    image: ${DOCKER_HUB_USERNAME:-stratifai}/odelia-orthanc-router:${TAG:-0.1.0}
    hostname: orthanc-router-mst
    container_name: odelia-orthanc-router-mst
    volumes:
    - ./deploy/config/orthanc-router.json:/etc/orthanc/orthanc.json:ro
    - ./deploy/volumes/orthanc-router-mst-db/:/var/lib/orthanc/db/
    - ./deploy/orthanc/manifest.json:/etc/orthanc/manifest.json:ro
    restart: unless-stopped
    networks:
    - odelia-network
    ports:
    - ${BIND_HOST:-}4243:4242
    - ${BIND_HOST:-}8043:8042
    environment:
    - ORTHANC__NAME=orthanc-router-mst
    - VERBOSE_ENABLED=true
    - VERBOSE_STARTUP=true
    - ORTHANC__PYTHON_SCRIPT=/python/server.py
    - ORTHANC__PYTHON_VERBOSE=true
    - MODEL_BACKEND_URL=http://mst-classifier:5556
    depends_on:
    - mst-classifier
  mst-classifier:
    image: ${DOCKER_HUB_USERNAME:-stratifai}/odelia-model-mst:${TAG:-0.1.0}
    container_name: odelia-model-mst
    environment:
      ORTHANC_URL: http://orthanc-router-mst:8042
      IMAGE_FOLDER: /app/mst-service/images
      MODEL_PATH: /app/mst-service/mst_model
    networks:
    - odelia-network
    ports:
    - ${BIND_HOST:-}5556:5556
  orthanc-router-medgemma:
    image: ${DOCKER_HUB_USERNAME:-stratifai}/odelia-orthanc-router:${TAG:-0.1.0}
    hostname: orthanc-router-medgemma
    container_name: odelia-orthanc-router-medgemma
    volumes:
    - ./deploy/config/orthanc-router.json:/etc/orthanc/orthanc.json:ro
    - ./deploy/volumes/orthanc-router-medgemma-db/:/var/lib/orthanc/db/
    restart: unless-stopped
    networks:
    - odelia-network
    ports:
    - ${BIND_HOST:-}4244:4242
    - ${BIND_HOST:-}8044:8042
    environment:
    - ORTHANC__NAME=orthanc-router-medgemma
    - VERBOSE_ENABLED=true
    - VERBOSE_STARTUP=true
    - ORTHANC__PYTHON_SCRIPT=/python/server.py
    - ORTHANC__PYTHON_VERBOSE=true
    - MODEL_BACKEND_URL=http://medgemma-mri:5557
    - AI_NAME=MedGemma Vision-Language Model
    depends_on:
    - medgemma-mri
  medgemma-mri:
    image: ${DOCKER_HUB_USERNAME:-stratifai}/odelia-model-medgemma:${TAG:-0.1.0}
    container_name: odelia-model-medgemma
    environment:
      ORTHANC_URL: http://orthanc-router-medgemma:8042
      IMAGE_FOLDER: /app/medgemma-service/images
      HF_TOKEN: "HF_TOKEN"
      NUM_SLICES: '100'
      MAX_NEW_TOKENS: '500'
      TORCH_DTYPE: bfloat16
    networks:
    - odelia-network
    ports:
    - ${BIND_HOST:-}5557:5557
  chat-middleware:
    image: ${DOCKER_HUB_USERNAME:-stratifai}/odelia-chat:${TAG:-0.1.0}
    container_name: odelia-chat
    environment:
      OLLAMA_URL: ${OLLAMA_URL:-http://host.docker.internal:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-thiagomoraes/medgemma-1.5-4b-it:F16}
      BACKEND_TYPE: ${BACKEND_TYPE:-ollama}
      OLLAMA_NUM_CTX: '128000'
      WADO_BASE_URL: http://orthanc-viewer:8042/dicom-web
      NUM_SLICES: '5'
      MAX_CACHE_ENTRIES: '100'
    networks:
    - odelia-network
    ports:
    - ${BIND_HOST:-}5560:5560
    depends_on:
    - orthanc-viewer
    extra_hosts:
    - host.docker.internal:host-gateway
  llamacpp-server:
    image: ghcr.io/ggml-org/llama.cpp:server-cuda
    profiles:
    - llamacpp
    container_name: odelia-llamacpp-server
    volumes:
    - ./deploy/volumes/models:/models:ro
    ports:
    - ${BIND_HOST:-}8090:8090
    networks:
    - odelia-network
    restart: unless-stopped
    command:
    - --host
    - 0.0.0.0
    - --port
    - '8090'
    - -m
    - /models/${GGUF_MODEL_FILE:-medgemma-1.5-4b-it-BF16.gguf}
    - --mmproj
    - /models/${MMPROJ_FILE:-mmproj-BF16.gguf}
    - -c
    - ${LLAMA_CTX_SIZE:-131072}
    - -ngl
    - ${LLAMA_N_GPU_LAYERS:-99}
    deploy:
      resources:
        reservations:
          devices:
          - driver: nvidia
            count: 1
            capabilities:
            - gpu
  grafana:
    image: grafana/grafana:11.1.0
    container_name: odelia-grafana
    ports:
    - ${BIND_HOST:-}3000:3000
    user: 0:0
    environment:
    - GF_INSTALL_PLUGINS=frser-sqlite-datasource
    - GF_SECURITY_ADMIN_USER=admin
    - GF_SECURITY_ADMIN_PASSWORD=odelia
    volumes:
    - ./deploy/grafana/provisioning:/etc/grafana/provisioning:ro
    - ./deploy/volumes/feedback-db/:/var/lib/odelia-feedback/
    depends_on:
    - orthanc-viewer
    networks:
    - odelia-network
  keycloak:
    image: quay.io/keycloak/keycloak:24.0.5
    command: start-dev --import-realm
    hostname: keycloak
    container_name: keycloak
    volumes:
    - ./deploy/config/ohif-keycloak-realm.json:/opt/keycloak/data/import/ohif-keycloak-realm.json
    environment:
      KC_DB_URL_HOST: postgres
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_SCHEMA: public
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: password
      KC_HOSTNAME_ADMIN_URL: http://localhost:8081/keycloak/
      KC_HOSTNAME_URL: http://localhost:8081/keycloak/
      KC_HOSTNAME_STRICT_BACKCHANNEL: 'true'
      KC_HOSTNAME_STRICT_HTTPS: 'false'
      KC_HTTP_ENABLED: 'true'
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      KC_HEALTH_ENABLED: 'true'
      KC_METRICS_ENABLED: 'true'
      KC_PROXY: edge
      KC_PROXY_HEADERS: xforwarded
      KEYCLOAK_JDBC_PARAMS: connectTimeout=40000
      KC_LOG_LEVEL: INFO
      KC_HOSTNAME_DEBUG: 'true'
      PROXY_ADDRESS_FORWARDING: 'true'
    ports:
    - ${BIND_HOST:-}8080:8080
    depends_on:
    - postgres
    restart: unless-stopped
    networks:
    - odelia-network
    healthcheck:
      test:
      - CMD-SHELL
      - "exec 3<>/dev/tcp/127.0.0.1/8080;echo -e \"GET /health/ready HTTP/1.1\r\nhost: http://localhost\r\nConnection: close\r\n\r\n\" >&3;grep \"HTTP/1.1 200 OK\" <&3"
      interval: 1s
      timeout: 5s
      retries: 10
      start_period: 60s
  postgres:
    image: postgres:15
    hostname: postgres
    container_name: postgres
    volumes:
    - postgres_data:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: password
    restart: unless-stopped
    networks:
    - odelia-network
volumes:
  postgres_data:
    driver: local
networks:
  odelia-network:
    driver: bridge
