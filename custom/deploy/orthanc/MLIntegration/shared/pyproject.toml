[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "mlintegration-shared"
version = "0.1.0"
description = "Shared library for Odelia ML Integration services"
requires-python = ">=3.12"
dependencies = [
  "flask>=2.0.0",
  "flask-cors>=3.0.0",
  "torch>=1.9.0",
  "torchio>=0.18.0",
  "pydicom>=2.0.0",
  "requests>=2.25.0",
  "numpy>=1.20.0",
  "SimpleITK>=2.0.0",
  "monai>=0.8.0",
  "huggingface-hub>=0.10.0",
]

[tool.setuptools.packages.find]
include = []
