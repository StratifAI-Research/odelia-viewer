[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "mlintegration-shared"
version = "0.1.0"
description = "Shared library for Odelia ML Integration services"
requires-python = ">=3.12"
dependencies = [
  "flask==3.1.3",
  "flask-cors==6.0.2",
  "torch==2.12.0",
  "torchio==1.2.0",
  "pydicom==3.0.2",
  "requests==2.34.2",
  "numpy==2.4.6",
  "SimpleITK==2.5.5",
  "monai==1.5.2",
  "huggingface-hub==1.15.0",
]

[tool.setuptools.packages.find]
include = []
