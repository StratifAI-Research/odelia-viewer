[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "mlintegration-bc-classification"
version = "0.1.0"
description = "Breast cancer classification service for Odelia ML Integration"
requires-python = ">=3.12"
dependencies = [
  "Flask",
  "Flask-Cors",
  "torch",
  "torchio",
  "monai",
  "requests",
  "dicomweb-client>=0.59.0",
  "numpy",
  "pydicom",
  "pandas",
]

[tool.setuptools.packages.find]
include = []
