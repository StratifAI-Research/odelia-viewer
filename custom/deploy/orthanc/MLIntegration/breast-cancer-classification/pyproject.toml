[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "mlintegration-bc-classification"
version = "0.1.0"
description = "Breast cancer classification service for Odelia ML Integration"
requires-python = ">=3.12"
dependencies = [
  "Flask==3.1.3",
  "Flask-Cors==6.0.2",
  "torch==2.12.0",
  "torchio==1.2.0",
  "monai==1.5.2",
  "requests==2.34.2",
  "dicomweb-client==0.61.0",
  "numpy==2.4.6",
  "pydicom==3.0.2",
  "pandas==3.0.3",
]

[tool.setuptools.packages.find]
include = []
