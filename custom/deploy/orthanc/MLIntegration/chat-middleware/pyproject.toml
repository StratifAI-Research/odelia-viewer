[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "mlintegration-chat-middleware"
version = "0.1.0"
description = "Chat middleware service for Odelia ML Integration"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.109.0",
  "uvicorn[standard]>=0.27.0",
  "websockets>=12.0",
  "aiohttp>=3.9.0",
  "pydantic>=2.5.0",
  "pydicom>=2.4.3",
  "SimpleITK>=2.3.1",
  "dicomweb-client>=0.59.0",
  "Pillow>=10.1.0",
  "numpy>=1.24.3",
]

[tool.setuptools.packages.find]
include = []
