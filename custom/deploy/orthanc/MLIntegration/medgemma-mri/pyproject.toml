[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "mlintegration-medgemma-mri"
version = "0.1.0"
description = "MedGemma MRI inference service for Odelia ML Integration"
requires-python = ">=3.12"
dependencies = [
  "Flask>=3.0.0",
  "Flask-Cors>=4.0.0",
  "transformers>=4.50.0",
  "accelerate>=0.26.0",
  "torch>=2.5.0",
  "huggingface_hub>=0.26.0",
  "pydicom>=2.4.3",
  "SimpleITK>=2.3.1",
  "Pillow>=10.1.0",
  "numpy>=1.24.3",
  "requests>=2.31.0",
  "dicomweb-client>=0.59.0",
]

[tool.setuptools.packages.find]
include = []
